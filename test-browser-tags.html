<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HuggingFace desde Navegador</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        h1 {
            color: #4CAF50;
        }
        .container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            background: #333;
            min-height: 50px;
        }
        .status.success {
            background: #2d5016;
            border-left: 4px solid #4CAF50;
        }
        .status.error {
            background: #5d1616;
            border-left: 4px solid #f44336;
        }
        .status.info {
            background: #163a5d;
            border-left: 4px solid #2196F3;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        .tag {
            background: #4CAF50;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 14px;
        }
        .log {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 3px;
        }
        .log-entry.error {
            color: #ff5252;
        }
        .log-entry.success {
            color: #4CAF50;
        }
        .log-entry.info {
            color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test HuggingFace desde Navegador</h1>
        
        <p style="color: #888;">Este test verifica que el navegador SÍ puede llamar a HuggingFace API (sin problemas de DNS/firewall)</p>
        
        <label for="imageUrl">URL de la imagen:</label>
        <input 
            type="text" 
            id="imageUrl" 
            value="https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/beignets-task-guide.png"
            placeholder="https://ejemplo.com/imagen.png"
        />
        
        <label for="taggerType">Tipo de Tagger:</label>
        <select id="taggerType">
            <option value="wd">WD-Tagger (Anime/General)</option>
            <option value="e621" selected>E621-Tagger (Furry Art)</option>
            <option value="pawfect">P.A.W.F.E.C.T (FurAffinity)</option>
        </select>
        
        <label for="hfToken">HuggingFace Token (opcional):</label>
        <input 
            type="password" 
            id="hfToken" 
            value="hf_YOUR_TOKEN_HERE"
            placeholder="hf_..."
        />
        
        <button id="testBtn" onclick="testGeneration()">🚀 Generar Tags</button>
        
        <div id="status" class="status">
            Listo para generar tags...
        </div>
        
        <div id="tags" class="tags"></div>
        
        <div id="log" class="log"></div>
    </div>

    <script type="module">
        // Interceptar console.log para mostrar en la UI
        const originalLog = console.log
        const originalError = console.error
        const originalWarn = console.warn
        
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log')
            const entry = document.createElement('div')
            entry.className = `log-entry ${type}`
            entry.textContent = message
            logDiv.appendChild(entry)
            logDiv.scrollTop = logDiv.scrollHeight
        }
        
        console.log = (...args) => {
            originalLog(...args)
            addLog(args.join(' '), 'info')
        }
        
        console.error = (...args) => {
            originalError(...args)
            addLog('❌ ' + args.join(' '), 'error')
        }
        
        console.warn = (...args) => {
            originalWarn(...args)
            addLog('⚠️  ' + args.join(' '), 'info')
        }
        
        // Importar el módulo
        import { generateTagsFromBrowser } from './src/lib/huggingFaceClient.js'
        
        window.testGeneration = async function() {
            const btn = document.getElementById('testBtn')
            const status = document.getElementById('status')
            const tagsDiv = document.getElementById('tags')
            const logDiv = document.getElementById('log')
            
            const imageUrl = document.getElementById('imageUrl').value
            const taggerType = document.getElementById('taggerType').value
            const hfToken = document.getElementById('hfToken').value
            
            if (!imageUrl) {
                alert('Por favor ingresa una URL de imagen')
                return
            }
            
            btn.disabled = true
            tagsDiv.innerHTML = ''
            logDiv.innerHTML = ''
            status.className = 'status info'
            status.textContent = 'Iniciando...'
            
            try {
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
                console.log('🧪 TEST DESDE NAVEGADOR')
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
                console.log('🖼️  Imagen:', imageUrl)
                console.log('🤖 Tagger:', taggerType)
                console.log('🔑 Token:', hfToken ? 'Configurado' : 'No configurado')
                console.log('')
                
                const tags = await generateTagsFromBrowser(
                    imageUrl,
                    taggerType,
                    hfToken,
                    (msg) => {
                        status.textContent = msg
                        console.log('[Status]', msg)
                    }
                )
                
                console.log('')
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
                console.log('✅ ÉXITO - TAGS GENERADOS')
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
                console.log(`📊 Total: ${tags.length} tags`)
                console.log(`🏷️  Top 10: ${tags.slice(0, 10).join(', ')}`)
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━')
                
                status.className = 'status success'
                status.textContent = `✅ ${tags.length} tags generados exitosamente!`
                
                tagsDiv.innerHTML = tags.map(tag => 
                    `<span class="tag">${tag}</span>`
                ).join('')
                
            } catch (err) {
                console.error('Error:', err.message)
                console.error('Stack:', err.stack)
                
                status.className = 'status error'
                status.textContent = `❌ Error: ${err.message}`
            } finally {
                btn.disabled = false
            }
        }
        
        console.log('✅ Módulo cargado correctamente')
        console.log('👉 Presiona "Generar Tags" para probar')
    </script>
</body>
</html>
